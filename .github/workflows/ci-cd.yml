name: CI/CD - Build, Test, and Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'worker/**'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'docker-compose.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test locally
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build images
      run: |
        docker compose build
    
    - name: Run unit tests (mock)
      run: |
        docker compose run --rm api npm test || true
        docker compose run --rm frontend npm test || true
        docker compose run --rm worker npm test || true
    
    - name: Cleanup
      if: always()
      run: docker compose down -v

  # Security scanning
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API image
      run: docker build -t ticketing-api:latest ./api
    
    - name: Build Frontend image
      run: docker build -t ticketing-frontend:latest ./frontend
    
    - name: Build Worker image
      run: docker build -t ticketing-worker:latest ./worker
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ticketing-api:latest
        format: 'sarif'
        output: 'trivy-api.sarif'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'
    
    - name: Upload Trivy API report to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-api.sarif'
        category: 'trivy-api'
    
    - name: Run Trivy vulnerability scanner - Frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ticketing-frontend:latest
        format: 'sarif'
        output: 'trivy-frontend.sarif'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'
    
    - name: Upload Trivy Frontend report
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-frontend.sarif'
        category: 'trivy-frontend'
    
    - name: Run Trivy vulnerability scanner - Worker
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ticketing-worker:latest
        format: 'sarif'
        output: 'trivy-worker.sarif'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'
    
    - name: Upload Trivy Worker report
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-worker.sarif'
        category: 'trivy-worker'

  # Publish images to registry
  publish:
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata - API
      id: meta_api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: ${{ steps.meta_api.outputs.tags }}
        labels: ${{ steps.meta_api.outputs.labels }}
        platforms: linux/amd64,linux/arm64
    
    - name: Extract metadata - Frontend
      id: meta_frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta_frontend.outputs.tags }}
        labels: ${{ steps.meta_frontend.outputs.labels }}
        platforms: linux/amd64,linux/arm64
    
    - name: Extract metadata - Worker
      id: meta_worker
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push Worker image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        push: true
        tags: ${{ steps.meta_worker.outputs.tags }}
        labels: ${{ steps.meta_worker.outputs.labels }}
        platforms: linux/amd64,linux/arm64

  # Deployment to Kubernetes (production)
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ticketing.example.com
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Configure kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/base/deployment.yaml
        kubectl apply -f k8s/base/rbac.yaml
        kubectl apply -f k8s/base/ingress-and-netpolicy.yaml
    
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/api -n ticketing --timeout=5m
        kubectl rollout status deployment/frontend -n ticketing --timeout=5m
        kubectl rollout status deployment/worker -n ticketing --timeout=5m
    
    - name: Verify deployment
      run: |
        kubectl get pods -n ticketing
        kubectl get services -n ticketing
        kubectl get ingress -n ticketing
    
    - name: Run smoke tests
      run: |
        API_URL="http://localhost:8080"
        
        # Port-forward for testing
        kubectl port-forward svc/api 8080:8080 -n ticketing &
        sleep 5
        
        # Health check
        curl -f $API_URL/healthz || exit 1
        curl -f $API_URL/readyz || exit 1
        
        # Get events
        curl -f $API_URL/events || exit 1
        
        pkill -f port-forward

  # Notification
  notify:
    if: always()
    needs: [build, security, publish, deploy]
    runs-on: ubuntu-latest
    
    steps:
    - name: Build status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Publish: ${{ needs.publish.result }}"
        echo "Deploy: ${{ needs.deploy.result }}"
    
    - name: Send Slack notification (optional)
      if: always()
      uses: slackapi/slack-github-action@v1.24
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "Ticketing Platform CI/CD Pipeline",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Build Result*: ${{ needs.build.result }}\n*Security*: ${{ needs.security.result }}\n*Publish*: ${{ needs.publish.result }}\n*Deploy*: ${{ needs.deploy.result }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                }
              }
            ]
          }
