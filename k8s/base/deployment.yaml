              key: NODE_ENV
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: ticketing-config
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: ticketing-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: ticketing-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ticketing-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ticketing-credentials
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
