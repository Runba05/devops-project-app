  namespace: ticketing
  labels:
    app: ticketing-platform

---
# Role for Frontend (read ConfigMaps)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: ticketing
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["ticketing-config"]
  verbs: ["get"]

---
# RoleBinding for Frontend
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-rolebinding
  namespace: ticketing
subjects:
- kind: ServiceAccount
  name: frontend-sa
  namespace: ticketing
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for Worker
